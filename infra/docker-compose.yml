services:
  postgres:
    image: postgres:16
    container_name: freela-postgres
    environment:
      POSTGRES_USER: freela
      POSTGRES_PASSWORD: freela
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freela -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [freela-net]

  kafka:
    image: apache/kafka:4.2.1
    container_name: freela-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [freela-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: freela-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: freela-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      JAVA_OPTS: "-Xms128m -Xmx256m"
    networks: [freela-net]

  mongodb:
    image: mongo:6.0
    container_name: freela-mongodb
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    restart: on-failure
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [freela-net]

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: freela-opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "action.auto_create_index=false"
      - "plugins.security.ssl.http.enabled=false"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=FreelaMarketplaceAdmin123!"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
    networks: [freela-net]

  graylog:
    image: graylog/graylog:6.0
    container_name: freela-graylog
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      GRAYLOG_JAVA_OPTS: "-Xms1g -Xmx1g"
      GRAYLOG_PASSWORD_SECRET: "somepasswordsecretwhichisatleast64characterslongfreelamarketplace123456"
      GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://localhost:9000/"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    ports:
      - "9000:9000"
      - "12201:12201/udp"
      - "12201:12201/tcp"
    volumes:
      - graylog_data:/usr/share/graylog/data
    networks: [freela-net]

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: freela-zipkin
    ports:
      - "9411:9411"
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
    networks: [freela-net]

volumes:
  postgres_data:
  mongodb_data:
  opensearch_data:
  graylog_data:

networks:
  freela-net:
    name: freela-net
